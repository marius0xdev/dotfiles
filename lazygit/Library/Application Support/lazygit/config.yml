# lazygit config (macOS reads ~/Library/Application Support/lazygit/config.yml).
# Omarchy ships an empty lazygit config, i.e. defaults; the only addition here is
# the Catppuccin Mocha (blue) theme to match Ghostty, tmux and Neovim.
# Theme: MIT, https://github.com/catppuccin/lazygit/blob/main/themes-mergable/mocha/blue.yml
gui:
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    authorColors:
      '*': '#b4befe'
