# Global CLI tools managed by mise (installed by `mise install` in bootstrap.sh).
# Prefer mise over Homebrew; all of these install prebuilt binaries.
# Versions are pinned exactly for reproducibility; bump them deliberately.
[tools]
gh = "2.103.3"
glab = "1.124.0"
lazygit = "0.66.2"
tmux = "3.7c"
starship = "1.27.0"
atuin = "18.23.0"

# Neovim + tools LazyVim relies on (search, file finding, treesitter parsers).
neovim = "0.12.6"
ripgrep = "15.2.0"
fd = "10.5.0"
fzf = "0.74.5"
tree-sitter = "0.27.1"

# Kubernetes: kubectl 1.35 line; sofka (Rust TUI) chosen over k9s, see docs.
kubectl = "1.35.9"
sofka = "0.31.14"

# DigitalOcean CLI: last 1.x release; the 2.x line is still settling.
doctl = "1.186.0"

# HashiCorp Vault CLI.
vault = "2.2.1"

# tfenv manages Terraform versions (reads .terraform-version per project).
tfenv = "3.2.2"

# AWS CLI v2 (official AWS installer, bundles its own Python).
aws-cli = "2.39.6"

# viddy: a modern `watch` (diffs, scrollable history of past runs).
viddy = "1.3.1"

# consul-template: not in mise's registry, and HashiCorp publishes binaries only
# on releases.hashicorp.com, so download those directly. Checksums come from the
# release's SHA256SUMS; update them together with the version.
[tools."http:consul-template"]
version = "0.43.1"

[tools."http:consul-template".platforms]
macos-arm64 = { url = "https://releases.hashicorp.com/consul-template/0.43.1/consul-template_0.43.1_darwin_arm64.zip", checksum = "sha256:bea40f5fb22b82a37d589c89c47891871151a08370ff337db218b003f8eceef8" }
macos-x64 = { url = "https://releases.hashicorp.com/consul-template/0.43.1/consul-template_0.43.1_darwin_amd64.zip", checksum = "sha256:42f334d635c306616e30cc21b2615fbd451d01b512a083a7c47443492503a222" }

[env]
# Keep tfenv's Terraform installs outside mise's per-version tfenv dir, so they
# survive tfenv upgrades.
TFENV_CONFIG_DIR = "{{env.HOME}}/.local/share/tfenv"
